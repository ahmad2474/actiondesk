name: actiondesk
x-backend: &backend
  image: actiondesk-backend:local
  build:
    context: ..
    dockerfile: infra/docker/backend.Dockerfile
  init: true
  environment: &backend-environment
    ACTIONDESK_ENVIRONMENT: local
    ACTIONDESK_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
    ACTIONDESK_REDIS_URL: redis://redis:6379/0
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.5-bookworm
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  bootstrap:
    <<: *backend
    command: [sh, -c, 'uv run --no-sync alembic upgrade head && uv run --no-sync python -m app.db.seed']
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *backend
    environment: &api-environment
      <<: *backend-environment
      ACTIONDESK_AUTH_SECRET: ${ACTIONDESK_AUTH_SECRET:-}
      ACTIONDESK_AUTH_ORGANIZATION_SLUG: ${ACTIONDESK_AUTH_ORGANIZATION_SLUG:-synthetic-demo}
      ACTIONDESK_AUTH_COOKIE_SECURE: ${ACTIONDESK_AUTH_COOKIE_SECURE:-false}
      ACTIONDESK_AUTH_ALLOWED_ORIGINS: ${ACTIONDESK_AUTH_ALLOWED_ORIGINS:-["http://127.0.0.1:3000","http://127.0.0.1:8000"]}
      ACTIONDESK_AUTH_IDLE_SECONDS: ${ACTIONDESK_AUTH_IDLE_SECONDS:-1800}
      ACTIONDESK_AUTH_ABSOLUTE_SECONDS: ${ACTIONDESK_AUTH_ABSOLUTE_SECONDS:-28800}
      ACTIONDESK_AUTH_TOUCH_SECONDS: ${ACTIONDESK_AUTH_TOUCH_SECONDS:-300}
      ACTIONDESK_AUTH_ARGON_MEMORY_KIB: ${ACTIONDESK_AUTH_ARGON_MEMORY_KIB:-65536}
      ACTIONDESK_AUTH_ARGON_TIME_COST: ${ACTIONDESK_AUTH_ARGON_TIME_COST:-3}
      ACTIONDESK_AUTH_ARGON_PARALLELISM: ${ACTIONDESK_AUTH_ARGON_PARALLELISM:-4}
      ACTIONDESK_AUTH_IP_LIMIT: ${ACTIONDESK_AUTH_IP_LIMIT:-20}
      ACTIONDESK_AUTH_IP_WINDOW_SECONDS: ${ACTIONDESK_AUTH_IP_WINDOW_SECONDS:-60}
      ACTIONDESK_AUTH_ACCOUNT_LIMIT: ${ACTIONDESK_AUTH_ACCOUNT_LIMIT:-10}
      ACTIONDESK_AUTH_ACCOUNT_WINDOW_SECONDS: ${ACTIONDESK_AUTH_ACCOUNT_WINDOW_SECONDS:-900}
    command: [uv, run, --no-sync, uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000', --reload, --no-access-log, --no-proxy-headers]
    ports: ['127.0.0.1:${API_PORT:-8000}:8000']
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, /workspace/.venv/bin/python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/ready", timeout=6)']
      interval: 10s
      timeout: 8s
      retries: 10
      start_period: 10s
  worker:
    <<: *backend
    command: [uv, run, --no-sync, celery, -A, actiondesk_worker.celery_app:celery_app, worker, --loglevel=INFO, --pool=solo, --hostname=actiondesk@worker, --without-gossip, --without-mingle]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, /workspace/.venv/bin/python, scripts/worker_smoke.py, --ping-only]
      interval: 20s
      timeout: 8s
      retries: 5
  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    init: true
    environment: {NEXT_TELEMETRY_DISABLED: '1'}
    ports: ['127.0.0.1:${WEB_PORT:-3000}:3000']
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 8s
      retries: 10
      start_period: 20s
  checks:
    <<: *backend
    profiles: [checks]
    environment:
      <<: *api-environment
      ACTIONDESK_ENVIRONMENT: test
    command: [uv, run, --no-sync, pytest, tests/integration, -v]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
volumes:
  postgres_data:
  redis_data:
