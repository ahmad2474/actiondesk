[project]
name = "actiondesk"
version = "0.0.1"
description = "ActionDesk Phase 0 foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<7",
  "celery[redis]>=5.5,<6",
  "argon2-cffi>=25.1,<26",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<3", "types-redis>=4.6", "types-PyYAML>=6", "pyyaml>=6,<7"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/app", "apps/worker/actiondesk_worker"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "actiondesk_worker"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/api/app", "apps/worker/actiondesk_worker", "apps/api/migrations", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires migrated PostgreSQL and Redis (run make test-integration)"]
addopts = "-ra"
